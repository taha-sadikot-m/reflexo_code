name: MVP gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-mvp-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://reflexo:reflexo@localhost:5432/reflexo_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/ci_mvp_gate.py
